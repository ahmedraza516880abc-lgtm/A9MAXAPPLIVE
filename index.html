<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>DroidStore - Android APK & Game Store</title>
    <meta name="description" content="Discover, upload, and download top Android APKs and mobile games. Community-driven, fast, secure, and mobile-friendly app store." />
    <meta property="og:title" content="DroidStore - Android APK & Game Store" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

  <body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 min-h-screen selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker registration for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
