<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="droidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#01875F" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#01875F" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#droidGrad)" filter="url(#shadow)"/>
  
  <!-- Play Store triangle stylized with Android Droid accents -->
  <g transform="translate(136, 120)">
    <!-- Play Triangle -->
    <path d="M 40,24 L 216,136 L 40,248 Z" fill="#FFFFFF" fill-opacity="0.95" />
    <path d="M 40,24 L 140,136 L 40,136 Z" fill="#E8F5E9" fill-opacity="0.4" />
    
    <!-- Android Antenna / Head details -->
    <circle cx="110" cy="80" r="10" fill="#01875F" />
    <circle cx="110" cy="192" r="10" fill="#01875F" />
    
    <!-- Subtle Play overlapping segments -->
    <path d="M 40,24 L 170,107 L 140,136 Z" fill="#A5D6A7" fill-opacity="0.5" />
    <path d="M 40,248 L 170,165 L 140,136 Z" fill="#66BB6A" fill-opacity="0.5" />
    <path d="M 170,107 L 216,136 L 170,165 Z" fill="#FFFFFF" />
  </g>

  <!-- Store bag handle / Star accent -->
  <circle cx="390" cy="120" r="24" fill="#FFD54F" />
  <path d="M390 106 L 394 117 L 405 117 L 396 124 L 400 135 L 390 128 L 380 135 L 384 124 L 375 117 L 386 117 Z" fill="#FFFFFF" />
</svg>
